name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build editable PPTX (sample deck)
        run: |
          mkdir -p samples/runs/my-style-afzal-30/output
          node scripts/build_editable_pptx.mjs \
            samples/runs/my-style-afzal-30/deck.md \
            samples/runs/my-style-afzal-30/output/deck-editable.pptx \
            --template my-style
